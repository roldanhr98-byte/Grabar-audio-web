name: Compilar APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detector-js:
    name: Pruebas del detector JavaScript (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright + Chromium
        working-directory: tools/js-test
        run: |
          npm init -y > /dev/null
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Ejecutar pruebas
        run: NODE_PATH=tools/js-test/node_modules node tools/js-test/detector.test.js

  apk:
    name: Pruebas unitarias y APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK (debug y release)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Preparar artefactos
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AudioVault-Browser-1.0.${VERSION_CODE}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/AudioVault-Browser-1.0.${VERSION_CODE}-debug.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -la out

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AudioVault-Browser-1.0.${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Subir informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publicar versión descargable
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AudioVault Browser 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK compilada automáticamente desde `${{ github.ref_name }}` (${{ github.sha }}).

            - **AudioVault-Browser-1.0.${{ github.run_number }}.apk**: versión release (recomendada).
            - **…-debug.apk**: versión de depuración (se instala junto a la release con otro identificador).

            Instalación: descarga la APK en el móvil y permite «Instalar apps desconocidas» para tu navegador o gestor de archivos.
            Consulta el README para las limitaciones de la captura de audio y el protocolo de pruebas en dispositivo real.
          files: |
            out/*.apk
            out/SHA256SUMS.txt
